function serviceDetail(s){return `<div class="panel"><div class="record-title">SERVICE REQUEST #${s.id}</div><div class="sub">${s.customer} · ${s.product}<br>${s.location}</div><div class="tools" style="margin-top:14px"><button class="btn">Call Customer</button><button class="btn">Reassign</button><button class="btn primary" onclick="toast('Status updated')">Update Status</button></div><div class="mini" style="margin-top:14px"><span class="sub">Engineer</span><b>${s.engineer}</b><div class="sub">Scheduled ${s.time}</div></div></div><div class="panel"><div class="panel-head"><h2>Status Tracker</h2><span class="status ${statusClass(s.status)}">${s.status}</span></div><div class="flowline"><span class="done">Created</span><span class="done">Assigned</span><span class="done">On The Way</span><span class="done">Arrived</span><span class="done">OTP Verified</span><span class="active">Service Started</span><span>Completed</span></div><div class="timeline" style="margin-top:18px">${event("11:42 AM","OTP successfully verified","Customer code accepted. Service can now begin.")}${event("11:33 AM","Engineer arrived on site","Location matched Peelamedu, Coimbatore.")}${event("10:15 AM","Engineer assigned","Arun accepted the job.")}</div></div>`}
function engineerPhone(){return `<div class="mobile-shell"><div class="phone"><div class="phone-top">Aakash Aqua Tech Field</div><div class="phone-body"><h2 style="margin:0;font-size:20px">Good Morning, Arun</h2><div class="sub">Tuesday, 06 Oct 2026</div><div class="mobile-kpis"><div><b>3</b><br><span class="sub">Assigned</span></div><div><b>1</b><br><span class="sub">Progress</span></div><div><b>2</b><br><span class="sub">Done</span></div></div><div class="job-mobile"><span class="status blue">11:00 AM</span><h3>Ravi Kumar</h3><div class="sub">Commercial RO · Peelamedu</div><p><b>Problem:</b> Low water pressure</p><div class="tools"><button class="btn">Call</button><button class="btn">Navigate</button></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="toast('Job started after OTP verification')">Start Job</button></div><div class="panel" style="box-shadow:none"><div class="panel-head"><h2>Verify Customer</h2></div><div class="otp-boxes"><input value="4"><input value="8"><input value="2"><input value="1"></div><button class="btn primary" style="width:100%" onclick="toast('Customer verified')">Verify</button></div><div class="report-form" style="margin-top:12px"><b>Service Report</b><textarea placeholder="Problem">Low water pressure</textarea><textarea placeholder="Diagnosis"></textarea><textarea placeholder="Work performed"></textarea><button class="btn">+ Add Part</button><div class="upload">Upload photos</div><button class="btn primary">Complete Service</button></div></div></div></div>`}
function invoiceDetail(i){return `<div class="panel-head"><h2>Invoice Detail</h2><span class="status ${statusClass(i.status)}">${i.status}</span></div><div class="record"><div><b>${i.id}</b><div class="sub">Bill To: ${i.customer}<br>GST-ready accounting document</div></div><div class="table-wrap"><table class="table"><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST</th><th>Total</th></tr><tr><td>Commercial RO Service</td><td>1</td><td>${money(12000)}</td><td>18%</td><td>${money(14160)}</td></tr><tr><td>RO Membrane</td><td>1</td><td>${money(9000)}</td><td>18%</td><td>${money(10620)}</td></tr><tr><td>Filter Set</td><td>1</td><td>${money(15000)}</td><td>18%</td><td>${money(17700)}</td></tr></table></div></div><div class="summary-grid" style="margin-top:12px"><div class="mini"><span class="sub">Total</span><b>${money(i.amount)}</b></div><div class="mini"><span class="sub">Paid</span><b>${money(i.paid)}</b></div><div class="mini"><span class="sub">Outstanding</span><b>${money(i.amount-i.paid)}</b></div><div class="mini"><span class="sub">Due Date</span><b style="font-size:14px">${i.due}</b></div></div>`}
function bar(label,val,max){return `<div class="barrow"><span>${label}</span><div class="bar"><i style="width:${Math.min(100,val/max*100)}%"></i></div><b>${val}${max===100?"%":""}</b></div>`}
function pager(n){return `<div class="pagination"><span>${n} records · sorted by latest activity</span><span>Rows 1-${n} of ${n} · ‹ 1 ›</span></div>`}
function openLead(id){const l=leads.find(x=>x.id===id);drawer(`<div class="page-head"><div><div class="crumb">Leads / ${l.id}</div><h1 class="page-title">${l.name}</h1><div class="page-note">${l.requirement} · ${l.location}</div></div><div class="head-actions"><button class="btn">Call</button><button class="btn">WhatsApp</button><button class="btn">Create Quote</button><button class="btn primary" onclick="toast('Lead converted to customer')">Convert</button></div></div><div class="summary-grid">${["Value|"+money(l.value),"Stage|"+l.stage,"Owner|"+l.owner,"Source|"+l.source].map(x=>{let[a,b]=x.split("|");return `<div class="mini"><span class="sub">${a}</span><b>${b}</b></div>`}).join("")}</div><div class="panel" style="margin-top:16px"><div class="tabs"><button class="active">Overview</button><button>Activity</button><button>Calls</button><button>Emails</button><button>Notes</button><button>Tasks</button><button>Quotes</button><button>Documents</button></div><div class="record"><div class="mini"><span class="sub">Created from</span><b>Website</b><div class="sub">Page: ${l.page}<br>Form: ${l.form}</div></div><div class="timeline">${event("Today 10:32 AM","Lead created from website","Source captured automatically from "+l.page+".")}${event("Today 11:05 AM","Call completed","Duration: 04:32")}${event("Today 11:20 AM","Follow-up scheduled",l.follow)}${event("Yesterday","Quotation sent","Quote value "+money(l.value))}</div></div></div>`)}
function openCustomer(id){const c=customers.find(x=>x.id===id);drawer(customer360(c))}
function openService(id){const s=services.find(x=>x.id===id);drawer(serviceDetail(s))}
function drawer(html){document.getElementById("drawerPanel").innerHTML=`<button class="close" style="float:right" onclick="closeModal('drawer')">×</button>${html}`;openModal("drawer")}
function openForm(type){closeModal("createModal");const title={lead:"New Lead",customer:"New Customer",service:"New Service Request",quote:"New Quote",invoice:"New Invoice",product:"New Product",amc:"New AMC"}[type]||"Create Record";document.getElementById("formTitle").textContent=title;document.getElementById("formBody").innerHTML=`<div class="form"><label>Name / Customer<input placeholder="Ravi Kumar"></label><label>Owner / Engineer<select><option>Arun</option><option>Meena</option><option>Gokul</option><option>Vijay</option></select></label><label>Module<select><option>${title}</option></select></label><label>Priority<select><option>Normal</option><option>High</option><option>Urgent</option></select></label><label class="full">Details<textarea placeholder="Enter realistic business details..."></textarea></label></div><div class="tools" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal('formModal')">Cancel</button><button class="btn primary" onclick="closeModal('formModal');toast('${title} created')">Save</button></div>`;openModal("formModal")}
function openSearch(){openModal("searchModal");setTimeout(()=>document.getElementById("globalSearch").focus(),50);renderSearch("")}
function renderSearch(q){const term=q.toLowerCase();const rows=[...leads.map(x=>["LEADS",x.name,x.requirement,"lead",x.id]),...customers.map(x=>["CUSTOMERS",x.name,x.location,"customer",x.id]),...services.map(x=>["SERVICE REQUESTS",x.id,x.customer+" · "+x.status,"service",x.id]),...invoices.map(x=>["INVOICES",x.id,x.customer+" · "+money(x.amount-x.paid),"billing",x.id]),...inventory.map(x=>["PRODUCTS",x.item,x.sku,"inventory",x.sku])].filter(r=>(r[1]+r[2]+r[0]).toLowerCase().includes(term));const groups=[...new Set(rows.map(r=>r[0]))];document.getElementById("searchResults").innerHTML=groups.map(g=>`<div class="search-group"><h4>${g}</h4>${rows.filter(r=>r[0]===g).slice(0,4).map(r=>`<div class="result" onclick="openSearchResult('${r[3]}','${r[4]}')"><div><b>${r[1]}</b><div class="sub">${r[2]}</div></div><span>›</span></div>`).join("")}</div>`).join("")||`<div class="empty"><b>No results found.</b>Try a customer, invoice, service ID or product name.</div>`}
function openSearchResult(type,id){closeModal("searchModal");if(type==="lead")openLead(id);else if(type==="customer")openCustomer(id);else if(type==="service")openService(id);else if(type==="billing")route("billing");else if(type==="inventory")route("inventory")}
function toggleShell(){document.getElementById("app").classList.toggle("collapsed")}
function openModal(id){document.getElementById(id).classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function backdropClose(e,id){if(e.target.id===id)closeModal(id)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2400)}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch()}if(e.key==="Escape"){["searchModal","createModal","formModal","drawer"].forEach(closeModal)}})
render();
</script>
</body>
</html>
